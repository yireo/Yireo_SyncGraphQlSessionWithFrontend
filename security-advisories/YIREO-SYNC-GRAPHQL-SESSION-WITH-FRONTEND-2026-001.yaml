aliases: []
summary: Customer GraphQL bearer token exposed to JavaScript and local storage via the customer section
details: >
  The module added the customer's GraphQL bearer token (from the oauth_token table) to the customer
  section data, which is delivered to JavaScript and stored in the browser's local storage. The token
  was also returned for persistent ("Remember Me") sessions in which the customer was not logged in,
  allowing anyone with access to a shared device to obtain a fully privileged customer token. The
  lookup did not check revocation and could return revoked tokens or tokens issued to other devices,
  and any cross-site scripting flaw in the shop could be used to steal the token. Version 1.0.0 no
  longer adds customer_token to the customer section. Merchants should upgrade and consider revoking
  existing customer tokens.
